name: Build Whiteboard India APK and AAB

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ]; then
            touch .env
            echo "GEMINI_API_KEY=" >> .env
            echo "Created fallback .env file"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Keystore & Signing Configuration
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret found. Generating signing keystore for CI..."
            rm -f my-upload-key.jks
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Whiteboard India, OU=Education, O=Whiteboard, L=Delhi, S=Delhi, C=IN"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK and AAB
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build Debug APK and AAB (Fallback / Debug Dispatch)
        if: "${{ github.event.inputs.build_type == 'debug' }}"
        run: |
          ./gradlew assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Organize Artifacts
        run: |
          mkdir -p build-artifacts/apk
          mkdir -p build-artifacts/bundle

          # Copy APKs
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/apk/ \;
          # Copy AABs
          find app/build/outputs/bundle/ -name "*.aab" -exec cp {} build-artifacts/bundle/ \;

          echo "Generated APK files:"
          ls -la build-artifacts/apk/
          echo "Generated AAB files:"
          ls -la build-artifacts/bundle/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-India-APK
          path: build-artifacts/apk/*.apk
          retention-days: 30

      - name: Upload AAB (Google Play Store Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-India-AAB
          path: build-artifacts/bundle/*.aab
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Whiteboard India Edition ${{ github.ref_name }}"
          body: |
            ## Whiteboard India Edition Release
            *Learn • Draw • Teach*

            ### Download Files:
            - **APK file**: Install directly on any Android device / tablet.
            - **AAB file**: Upload directly to Google Play Console.
          files: |
            build-artifacts/apk/*.apk
            build-artifacts/bundle/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
