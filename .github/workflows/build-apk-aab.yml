name: Build Whiteboard India APK and AAB

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"whiteboard-india-edition","storage_bucket":"whiteboard-india-edition.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef","android_client_info":{"package_name":"com.whiteboard.indiaedition"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Keystore & Signing Configuration
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating release keystore for CI build..."
            rm -f my-upload-key.jks
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Whiteboard India, OU=Education, O=Whiteboard, L=Delhi, ST=Delhi, C=IN"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon -x lint || \
          ./gradlew assembleDebug bundleDebug --no-daemon -x lint

      - name: Organize Artifacts
        run: |
          mkdir -p build-artifacts/apk
          mkdir -p build-artifacts/bundle

          # Copy APKs
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp -v {} build-artifacts/apk/ \;
          # Copy AABs
          find app/build/outputs/bundle/ -name "*.aab" -type f -exec cp -v {} build-artifacts/bundle/ \;

          echo "Generated APK files:"
          ls -la build-artifacts/apk/
          echo "Generated AAB files:"
          ls -la build-artifacts/bundle/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-India-APK
          path: build-artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload AAB (Google Play Store Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-India-AAB
          path: build-artifacts/bundle/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Whiteboard India Edition ${{ github.ref_name }}"
          body: |
            ## Whiteboard India Edition Release
            *Learn • Draw • Teach*

            ### Download Files:
            - **APK file**: Install directly on any Android device / tablet.
            - **AAB file**: Upload directly to Google Play Console.
          files: |
            build-artifacts/apk/*.apk
            build-artifacts/bundle/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
